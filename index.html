<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas de Geometría Compleja</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: #e0e0e0; }
    
    /* Panel lateral */
    sidebar {
      width: 280px;
      background: #252526;
      border-right: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
    }
    sidebar h2 { font-size: 1.1rem; color: #ffffff; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #3c3c3c; }
    
    .nav-list { list-style: none; }
    .nav-item { margin-bottom: 0.5rem; }
    .nav-link {
      display: block;
      padding: 0.6rem 0.8rem;
      color: #9cdcfe;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.95rem;
      transition: background 0.2s;
    }
    .nav-link:hover { background: #37373d; color: #ffffff; }

    /* Visor PDF */
    main { flex: 1; height: 100%; background: #525659; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <sidebar>
    <h2>Geometría Compleja</h2>
    <ul class="nav-list">
      <li class="nav-item">
        <a class="nav-link" href="main.pdf" target="pdf-frame">📄 Notas Principales</a>
      </li>
    </ul>
  </sidebar>

  <main>
    <iframe name="pdf-frame" src="main.pdf"></iframe>
  </main>

</body>
</html>
