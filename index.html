<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas de Geometría Compleja</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { display: flex; height: 100vh; font-family: system-ui, -apple-system, sans-serif; background: #1e1e1e; color: #e0e0e0; }
    
    sidebar {
      width: 300px;
      background: #252526;
      border-right: 1px solid #3c3c3c;
      display: flex;
      flex-direction: column;
      padding: 1.5rem 1rem;
      overflow-y: auto;
    }
    sidebar h2 { font-size: 1.1rem; color: #ffffff; margin-bottom: 1.2rem; padding-bottom: 0.5rem; border-bottom: 1px solid #3c3c3c; }
    
    .section-title { font-size: 0.8rem; text-transform: uppercase; color: #858585; margin: 1rem 0 0.5rem 0.5rem; letter-spacing: 0.5px; }
    .nav-list { list-style: none; }
    .nav-link {
      display: flex;
      align-items: center;
      padding: 0.5rem 0.8rem;
      color: #9cdcfe;
      text-decoration: none;
      border-radius: 4px;
      font-size: 0.9rem;
      transition: background 0.15s ease;
    }
    .nav-link:hover { background: #37373d; color: #ffffff; }

    main { flex: 1; height: 100%; background: #525659; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <sidebar>
    <h2>Geometría Compleja</h2>
    
    <div class="section-title">Documento Completo</div>
    <ul class="nav-list">
      <li><a class="nav-link" href="Notas/main.pdf" target="pdf-frame">📄 Portada e Índice</a></li>
    </ul>

    <div class="section-title">Índice de Temas</div>
    <ul class="nav-list">
      <!-- Los enlaces apuntan a paginas o etiquetas especificas del PDF -->
      <li><a class="nav-link" href="Notas/main.pdf#page=1" target="pdf-frame">📌 Capítulo 1</a></li>
      <li><a class="nav-link" href="Notas/main.pdf#page=5" target="pdf-frame">📌 Capítulo 2</a></li>
      <li><a class="nav-link" href="Notas/main.pdf#page=12" target="pdf-frame">📌 Variedades de Kähler</a></li>
    </ul>
  </sidebar>

  <main>
    <!-- Si la ruta Notas/main.pdf falla, prueba cambiándola a solo main.pdf -->
    <iframe name="pdf-frame" src="main.pdf"></iframe>
  </main>

</body>
</html>
