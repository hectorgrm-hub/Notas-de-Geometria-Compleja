<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notas de Geometría Compleja</title>
  <style>
    /* Quitamos los márgenes para que el visor ocupe toda la pantalla */
    body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #525659; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <!-- Los parámetros al final de la URL controlan el visor del navegador -->
  <iframe src="Notas/main.pdf#pagemode=bookmarks&view=FitH"></iframe>

</body>
</html>
